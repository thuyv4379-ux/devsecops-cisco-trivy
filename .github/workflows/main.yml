name: DevSecOps Demo - Cisco IOS CIS Audit & Trivy Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  cisco-ios-cis-audit:
    name: 1. Python Audit Cisco IOS (CIS Benchmark)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find and run audit.py
        run: |
          AUDIT_SCRIPT=$(find . -name "audit.py" -print -quit)
          echo "Found audit script: $AUDIT_SCRIPT"
          if [ -n "$AUDIT_SCRIPT" ]; then
            python "$AUDIT_SCRIPT"
          else
            echo "audit.py not found in repo, skipping script execution."
          fi

      - name: Upload Cisco IOS Audit Reports (HTML & JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cisco-ios-cis-reports
          path: "**/reports/*.{html,json}"
          if-no-files-found: ignore

  docker-trivy-scan:
    name: 2. Build Docker Image & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: cisco-ios-cis-audit

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create fallback app & Dockerfile if missing
        run: |
          if [ ! -f "Dockerfile" ]; then
            cat << 'EOF' > app.py
          from flask import Flask, jsonify
          app = Flask(__name__)
          @app.route("/")
          def health():
              return jsonify({"status": "running"})
          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=5000)
          EOF
            echo "flask==3.0.3" > requirements.txt
            cat << 'EOF' > Dockerfile
          FROM python:3.12-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY app.py .
          EXPOSE 5000
          CMD ["python", "app.py"]
          EOF
          fi

      - name: Build demo Docker image
        run: |
          docker build -t devsecops-cisco-service:ci .

      - name: Run Trivy scan (Report HIGH & CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devsecops-cisco-service:ci"
          format: "table"
          exit-code: "0"
          severity: "HIGH,CRITICAL"

      - name: Trivy Quality Gate - Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devsecops-cisco-service:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: "false"
          severity: "CRITICAL"
