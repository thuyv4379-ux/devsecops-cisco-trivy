name: DevSecOps Demo - Cisco IOS CIS Audit & Trivy Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  cisco-ios-cis-audit:
    name: 1. Python Audit Cisco IOS (CIS Benchmark)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Cisco IOS CIS Audit script
        working-directory: Nguoi1_Cisco_Hardening/Nguoi1_Cisco_Hardening/Nguoi2_Python_Audit
        run: |
          python audit.py

      - name: Upload Cisco IOS Audit Reports (HTML & JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cisco-ios-cis-reports
          path: Nguoi1_Cisco_Hardening/Nguoi1_Cisco_Hardening/Nguoi2_Python_Audit/reports/

  docker-trivy-scan:
    name: 2. Build Docker Image & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: cisco-ios-cis-audit

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build demo Docker image
        run: |
          docker build -t devsecops-cisco-service:ci .

      - name: Run Trivy scan (Report HIGH & CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devsecops-cisco-service:ci"
          format: "table"
          exit-code: "0"
          severity: "HIGH,CRITICAL"

      - name: Trivy Quality Gate - Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devsecops-cisco-service:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: "false"
          severity: "CRITICAL"
